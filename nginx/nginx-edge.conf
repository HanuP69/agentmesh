# ───────────────────────────────────────────────────────────────────
# nginx-edge.conf — Public-Facing Edge Load Balancer
# ───────────────────────────────────────────────────────────────────

worker_processes auto;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    keepalive_timeout 65;
    client_max_body_size 30m;

    # Only define the api_gateway upstream pool.
    # No internal microservice upstreams are declared here, preventing startup DNS failures.
    upstream api_gateway {
        least_conn;
        server api-gateway-1:8000 max_fails=0;
        server api-gateway-2:8000 max_fails=0;
    }

    # Edge Server (public-facing, TLS termination)
    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/certs/selfsigned.crt;
        ssl_certificate_key /etc/nginx/certs/selfsigned.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        location / {
            proxy_pass http://api_gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_next_upstream error timeout http_502;
            proxy_read_timeout 180s;
        }

        location /stream/ {
            proxy_pass http://api_gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_buffering off;
            proxy_read_timeout 120s;
        }
    }

    server {
        listen 80;
        server_name _;

        location / {
            proxy_pass http://api_gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_next_upstream error timeout http_502;
            proxy_read_timeout 180s;
        }

        location /stream/ {
            proxy_pass http://api_gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_buffering off;
            proxy_read_timeout 120s;
        }
    }

    # Health check server block to satisfy docker-compose healthchecks
    server {
        listen 8080;
        location /nginx-health {
            return 200 '{"status": "ok", "role": "edge-lb"}';
            add_header Content-Type application/json;
        }
    }
}
