# ───────────────────────────────────────────────────────────────────
# nginx.conf — Edge Load Balancer + Internal Service Router (Explicit Replicas)
# ───────────────────────────────────────────────────────────────────

worker_processes auto;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    keepalive_timeout 65;
    client_max_body_size 30m;

    # ── Upstream pools ─────────────────────────────────────────────
    upstream api_gateway {
        least_conn;
        server api-gateway-1:8000 max_fails=0;
        server api-gateway-2:8000 max_fails=0;
    }

    upstream text_agents {
        least_conn;
        server text-agent-1:8001 max_fails=0;
        server text-agent-2:8001 max_fails=0;
    }

    upstream table_agents {
        least_conn;
        server table-agent-1:8002 max_fails=0;
        server table-agent-2:8002 max_fails=0;
    }

    upstream image_agents {
        least_conn;
        server image-agent-1:8003 max_fails=0;
        server image-agent-2:8003 max_fails=0;
    }

    upstream supervisor {
        least_conn;
        server supervisor-1:8010 max_fails=0;
        server supervisor-2:8010 max_fails=0;
    }

    upstream synthesizer {
        least_conn;
        server synthesizer-1:8004 max_fails=0;
        server synthesizer-2:8004 max_fails=0;
    }

    upstream ingestion {
        least_conn;
        server ingestion-1:8005 max_fails=0;
        server ingestion-2:8005 max_fails=0;
    }

    upstream chat {
        least_conn;
        server chat-1:8006 max_fails=0;
        server chat-2:8006 max_fails=0;
    }


    upstream ml_service {
        server ml-service-1:8007 max_fails=0;
    }

    # ── Edge Server (public-facing, TLS termination) ───────────────
    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/certs/selfsigned.crt;
        ssl_certificate_key /etc/nginx/certs/selfsigned.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        location / {
            proxy_pass http://api_gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_next_upstream error timeout http_502;
        }

        location /stream/ {
            proxy_pass http://api_gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_buffering off;
            proxy_read_timeout 120s;
        }
    }

    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ── Internal Service Router (port 8080) ────────────────────────
    server {
        listen 8080;

        location /text-agent/ {
            proxy_pass http://text_agents/;
            proxy_set_header Host $host;
            proxy_next_upstream error timeout http_502;
        }

        location /table-agent/ {
            proxy_pass http://table_agents/;
            proxy_set_header Host $host;
            proxy_next_upstream error timeout http_502;
        }

        location /image-agent/ {
            proxy_pass http://image_agents/;
            proxy_set_header Host $host;
            proxy_next_upstream error timeout http_502;
        }

        location /supervisor/ {
            proxy_pass http://supervisor/;
            proxy_set_header Host $host;
            proxy_next_upstream error timeout http_502;
            proxy_read_timeout 60s;
        }

        location /synthesizer/ {
            proxy_pass http://synthesizer/;
            proxy_set_header Host $host;
            proxy_next_upstream error timeout http_502;
            proxy_read_timeout 60s;
        }

        location /ingestion/ {
            proxy_pass http://ingestion/;
            proxy_set_header Host $host;
            proxy_next_upstream error timeout http_502;
            proxy_read_timeout 180s;
            client_max_body_size 30m;
        }

        location /chat/ {
            proxy_pass http://chat/;
            proxy_set_header Host $host;
            proxy_next_upstream error timeout http_502;
        }

        location /ml/ {
            proxy_pass http://ml_service/;
            proxy_set_header Host $host;
            proxy_next_upstream error timeout http_502;
            proxy_read_timeout 180s;
            client_max_body_size 30m;
        }

        location /nginx-health {
            return 200 '{"status": "ok", "role": "internal-lb"}';
            add_header Content-Type application/json;
        }
    }
}
